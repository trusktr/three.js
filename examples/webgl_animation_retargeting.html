	<body>

		<script type="module">

			import * as THREE from 'three';

			import Stats from 'three/addons/libs/stats.module.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { BVHLoader } from 'three/addons/loaders/BVHLoader.js';
			import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

			import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

			const clock = new THREE.Clock();
			const container = document.getElementById( 'container' );

			const stats = new Stats();
			container.appendChild( stats.dom );

			const renderer = new THREE.WebGLRenderer( { antialias: true } );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			container.appendChild( renderer.domElement );

			const pmremGenerator = new THREE.PMREMGenerator( renderer );

			const scene = new THREE.Scene();
			scene.background = new THREE.Color( 0x333333 );
			scene.environment = pmremGenerator.fromScene( new RoomEnvironment( renderer ), 0.04 ).texture;

			const camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 1000 );
			// camera.position.set( 5, 2, 8 );
			camera.position.set( 0, 0, 8 );

			const controls = new OrbitControls( camera, renderer.domElement );
			controls.target.set( 0, 0.5, 0 );
			controls.update();
			controls.enablePan = true;
			controls.enableDamping = true;

			const [ sourceModel, targetModel, targetModel2 ] = await Promise.all([

				new Promise( ( resolve, reject ) => {

					// ours
					// new GLTFLoader().load( 'models/gltf/Catwalk.gltf', resolve, undefined, reject );
					new BVHLoader().load( 'models/bvh/anim.bvh', resolve, undefined, reject );

					// three's
					// new GLTFLoader().load( 'models/gltf/Michelle.glb', resolve, undefined, reject );

				} ),

				new Promise( ( resolve, reject ) => {

					// ours
					// new GLTFLoader().load( 'models/gltf/unreal_manny.glb', resolve, undefined, reject );
					// new GLTFLoader().load( 'models/gltf/pete/pete.glb', resolve, undefined, reject );
					new GLTFLoader().load( 'models/gltf/michelle/michelle.gltf', resolve, undefined, reject );
					// new GLTFLoader().load( 'models/gltf/lola-walking.glb', resolve, undefined, reject );

					// three's
					// new GLTFLoader().load( 'models/gltf/Michelle.glb', resolve, undefined, reject );
					// new GLTFLoader().load( 'models/gltf/Soldier.glb', resolve, undefined, reject );

				} ),

				// new Promise( ( resolve, reject ) => {

				// 	new GLTFLoader().load( 'models/gltf/Michelle.glb', resolve, undefined, reject );

				// } ),

			]);

			const playAnimations = false;
			const timeScale = 1;

			let targetMixer;
			let sourceMixer;
			let sourceClip
			let sourceSkeletonHelper
			let sourceSkeleton
			// handleSource(sourceModel)
			handleSourceBvh(sourceModel)

			// const target2Mixer = handlePete(targetModel)
			const target2Mixer = handleMichelle(targetModel)
			// const target2Mixer = handleSoldier(targetModel)

			// handleManny()

			function handleSource(sourceModel) {

				console.log( 'source model:', sourceModel );

				sourceClip = sourceModel.animations[ 0 ]

				console.log( 'source clip:',  sourceClip);

				// sourceClip.tracks = sourceClip.tracks.filter(track => ['mixamorigHips', 'mixamorigSpine', 'mixamorigLeftArm'].some(name => track.name.startsWith(name)))

				sourceModel.scene.position.x -= 1.5;
				scene.add( sourceModel.scene );

				sourceSkeletonHelper = new THREE.SkeletonHelper( sourceModel.scene, { axesHelperSize: 0 } );
				scene.add( sourceSkeletonHelper );
				console.log( 'source skeleton helper', sourceSkeleton );

				sourceSkeleton = new THREE.Skeleton( sourceSkeletonHelper.bones );
				console.log( sourceSkeleton );
				console.log( 'source skeleton', sourceSkeleton );

				sourceMixer = new THREE.AnimationMixer( sourceModel.scene );
				sourceMixer.clipAction( sourceClip ).play();

			}

			function handleSourceBvh(sourceModel) {

				// Replace colons like Three does with GLTFLoader.
				sourceModel.clip.tracks.forEach( track => track.name = track.name.replace( ':', '' ) );
				sourceModel.skeleton.bones.forEach( bone => bone.name = bone.name.replace( ':', '' ) );

				// Scale down the bones
				sourceModel.skeleton.bones[0].traverse( bone => {

					bone.position.multiplyScalar( 0.01 ) 
					bone.scale.set( 1, 1, 1 ) 
					// bone.rotation.x -= Math.PI / 2

				} );

				sourceModel.clip.tracks.forEach( track => {

					if ( track.name.includes('.position') ) {

						track.values.forEach(( value, i ) => track.values[ i ] = value * 0.01 )

					} else if ( track.name === ('mixamorigHips.quaternion') ) {

						// console.log( 'rotate hip quaternions' );

						// for ( let i = 0, l = track.values.length / 4; i < l; i++ ) {

						// 	console.log('before:', track.values[i+0], track.values[i+1], track.values[i+2], track.values[i+3]);

						// }

						// const neg90 = new THREE.Quaternion().setFromAxisAngle( new THREE.Vector3( 1, 0, 0 ), -Math.PI / 2 )

						// for ( let i = 0, l = track.values.length / 4; i < l; i++ ) {

						// 	const quat = new THREE.Quaternion().fromArray( track.values, i );
						// 	quat.multiplyQuaternions( quat, neg90 );
						// 	quat.toArray( track.values, i );
						// 	console.log('after:', track.values[i], track.values[i+1], track.values[i+2], track.values[i+3])

						// }

					}

				} );

				console.log( 'source model:', sourceModel );

				sourceClip = sourceModel.clip;
				console.log( 'source clip:',  sourceClip);

				// sourceClip.tracks = sourceClip.tracks.filter(track => ['mixamorigHips', 'mixamorigSpine', 'mixamorigLeftArm'].some(name => track.name.startsWith(name)))

				const root = sourceModel.skeleton.bones[ 0 ]
				// root.scale.multiplyScalar(0.01)
				// root.position.multiplyScalar(0.01)
				// root.position.x -= 1.5;
				// root.rotation.x -= Math.PI;
				scene.add( root );

				sourceSkeletonHelper = new THREE.SkeletonHelper( root, { axesHelperSize: 0.1 } );
				scene.add( sourceSkeletonHelper );
				console.log( 'source skeleton helper', sourceSkeleton );

				sourceSkeleton = sourceModel.skeleton
				console.log( 'source skeleton', sourceSkeleton );

				sourceMixer = new THREE.AnimationMixer( root );
				const action = sourceMixer.clipAction( sourceClip ).play();
				action.timeScale = timeScale;

			}

			function handlePete(targetModel) {

				console.log( 'pete:', targetModel );

				// remove pete's helmet, shield, and sword
				targetModel.scene.remove( targetModel.scene.children[ 1 ] );
				targetModel.scene.remove( targetModel.scene.children[ 1 ] );
				targetModel.scene.remove( targetModel.scene.children[ 1 ] );

				targetModel.scene.position.x += 1.5;
				scene.add( targetModel.scene );

				const targetSkin = targetModel.scene.children[ 0 ].children[ 0 ];

				const targetSkelHelper = new THREE.SkeletonHelper( targetModel.scene, { axesHelperSize: 5 } );
				scene.add( targetSkelHelper );

				const retargetOptions = {

					// specify the name of the source's hip bone.
					hip: 'mixamorigHips',

					// Map of target's bone names to source's bone names
					names: {

						hips: 'mixamorigHips',

						spine: 'mixamorigSpine',
						chest: 'mixamorigSpine2',
						head: 'mixamorigHead',

						upperarml: 'mixamorigLeftArm',
						upperarmr: 'mixamorigRightArm',
						lowerarml: 'mixamorigLeftForeArm',
						lowerarmr: 'mixamorigRightForeArm',

						upperlegl: 'mixamorigLeftUpLeg',
						upperlegr: 'mixamorigRightUpLeg',
						lowerlegl: 'mixamorigLeftLeg',
						lowerlegr: 'mixamorigRightLeg',
						footl: 'mixamorigLeftFoot',
						footr: 'mixamorigRightFoot',

					}

				};

				// const newNames = {}
				// for (const name in retargetOptions.names) {
				// 	if (['mixamorigHips', 'mixamorigSpine', 'mixamorigLeftArm'].some(name => name.startsWith(name)))
				// 		newNames[name] = retargetOptions.names[name]
				// }
				// retargetOptions.names = newNames

				let mixer;

				if ( playAnimations ) {

					const retargetedClip = SkeletonUtils.retargetClip( targetSkin, sourceSkeleton, sourceClip, retargetOptions );
					console.log( 'retargeted clip', retargetedClip );

					// Apply the mixer directly to the SkinnedMesh, not any
					// ancestor node, because that's what
					// SkeletonUtils.retargetClip outputs the clip to be
					// compatible with.
					mixer = new THREE.AnimationMixer( targetSkin );
					const action = mixer.clipAction( retargetedClip ).play();
					action.timeScale = timeScale;

				}

				return mixer;

			}

			function handleMichelle(targetModel) {

				console.log( 'michelle:', targetModel );

				// const sourceIsBvh = !! sourceModel.clip
				// if (sourceIsBvh) targetModel.scene.rotation.x -= Math.PI / 2;

				targetModel.scene.position.x += 0;
				scene.add( targetModel.scene );

				const skelHelper = new THREE.SkeletonHelper( targetModel.scene, { axesHelperSize: 10 } );
				scene.add( skelHelper );

				const targetSkin = targetModel.scene.children[ 0 ].children[ 0 ];

				const retargetOptions = {

					// preservePosition: false,
					// preserveHipPosition: false,

					// specify the name of the target's hip bone.
					hip: 'mixamorigHips',

					// Map of target's bone names to source's bone names
					names: {

						mixamorigHips: 'mixamorigHips',

						mixamorigSpine: 'mixamorigSpine',
						mixamorigSpine1: 'mixamorigSpine1',
						mixamorigSpine2: 'mixamorigSpine2',
						mixamorigNeck: 'mixamorigNeck',
						mixamorigHead: 'mixamorigHead',
						mixamorigHeadTop_End: 'mixamorigHeadTop_End',

						mixamorigLeftShoulder: 'mixamorigLeftShoulder',
						mixamorigRightShoulder: 'mixamorigRightShoulder',
						mixamorigLeftArm: 'mixamorigLeftArm',
						mixamorigRightArm: 'mixamorigRightArm',
						mixamorigLeftForeArm: 'mixamorigLeftForeArm',
						mixamorigRightForeArm: 'mixamorigRightForeArm',
						mixamorigLeftHand: 'mixamorigLeftHand',
						mixamorigRightHand: 'mixamorigRightHand',

						mixamorigLeftUpLeg: 'mixamorigLeftUpLeg',
						mixamorigRightUpLeg: 'mixamorigRightUpLeg',
						mixamorigLeftLeg: 'mixamorigLeftLeg',
						mixamorigRightLeg: 'mixamorigRightLeg',
						mixamorigLeftFoot: 'mixamorigLeftFoot',
						mixamorigRightFoot: 'mixamorigRightFoot',
						mixamorigLeftToeBase: 'mixamorigLeftToeBase',
						mixamorigRightToeBase: 'mixamorigRightToeBase',
						mixamorigLeftToe_End: 'mixamorigLeftToe_End',
						mixamorigRightToe_End: 'mixamorigRightToe_End',

					}

				};

				// const newNames = {}
				// for (const name in retargetOptions.names) {
				// 	if (['mixamorigHips', 'mixamorigSpine', 'mixamorigLeftArm'].some(name => name.startsWith(name)))
				// 		newNames[name] = retargetOptions.names[name]
				// }
				// retargetOptions.names = newNames

				let mixer

				if ( playAnimations ) {

					const retargetedClip = SkeletonUtils.retargetClip( targetSkin, sourceSkeleton, sourceClip, retargetOptions );
					console.log( 'retargeted clip 2', retargetedClip );

					// Apply the mixer directly to the SkinnedMesh, not any
					// ancestor node, because that's what
					// SkeletonUtils.retargetClip outputs the clip to be
					// compatible with.
					mixer = new THREE.AnimationMixer( targetSkin );
					mixer.clipAction( retargetedClip ).play();

				}

				return mixer;

			}

			function handleSoldier(targetModel) {

				console.log( 'soldier:', targetModel );

				targetModel.scene.position.x += 0;
				scene.add( targetModel.scene );

				const targetSkin = targetModel.scene.children[ 0 ].children[ 0 ];
				console.log('skin:', targetSkin)

				const retargetOptions = {

					// specify the name of the target's hip bone.
					hip: 'mixamorigHips',

					// Map of target's bone names to source's bone names
					names: {

						mixamorigHips: 'mixamorigHips',

						mixamorigSpine: 'mixamorigSpine',
						mixamorigSpine2: 'mixamorigSpine2',
						// mixamorigHead: 'mixamorigHead',

						mixamorigLeftArm: 'mixamorigLeftArm',
						// mixamorigRightArm: 'mixamorigRightArm',
						// mixamorigLeftForeArm: 'mixamorigLeftForeArm',
						// mixamorigRightForeArm: 'mixamorigRightForeArm',

						// mixamorigLeftUpLeg: 'mixamorigLeftUpLeg',
						// mixamorigRightUpLeg: 'mixamorigRightUpLeg',
						// mixamorigLeftLeg: 'mixamorigLeftLeg',
						// mixamorigRightLeg: 'mixamorigRightLeg',
						// mixamorigLeftFoot: 'mixamorigLeftFoot',
						// mixamorigRightFoot: 'mixamorigRightFoot',

					}

				};

				let mixer

				if ( playAnimations ) {

					const retargetedClip = SkeletonUtils.retargetClip( targetSkin, sourceSkeleton, sourceClip, retargetOptions );
					console.log( 'retargeted clip 2', retargetedClip );

					// Apply the mixer directly to the SkinnedMesh, not any
					// ancestor node, because that's what
					// SkeletonUtils.retargetClip outputs the clip to be
					// compatible with.
					mixer = new THREE.AnimationMixer( targetSkin );
					mixer.clipAction( retargetedClip ).play();

				}

				return mixer;

			}

			function handleManny() {

				// unreal_manny remove LODs
				// const model = pete.scene.children[ 0 ].children[ 0 ];
				// model.remove( model.children[ 0 ] );
				// model.remove( model.children[ 0 ] );
				// model.remove( model.children[ 0 ] );
				// model.traverse( n => n.isMesh && ( n.material.wireframe = true ) );

				// remove pete's helmet, shield, and sword
				targetModel.scene.remove( targetModel.scene.children[ 1 ] );
				targetModel.scene.remove( targetModel.scene.children[ 1 ] );
				targetModel.scene.remove( targetModel.scene.children[ 1 ] );

				targetModel.scene.position.x += 1;
				scene.add( targetModel.scene );

				sourceModel.scene.position.x -= 1;
				scene.add( sourceModel.scene );

				const targetSkin = targetModel.scene.children[ 0 ].children[ 0 ];
				// const targetSkin = pete.scene.children[ 0 ].children[ 0 ].children[ 0 ].children[ 0 ]; // unreal_manny
				// const targetSkin2 = pete.scene.children[ 0 ].children[ 0 ].children[ 0 ].children[ 1 ]; // unreal_manny
				// debugger;
				const sourceSkin = sourceModel.scene.children[ 0 ].children[ 0 ];

				// const sourceSkeletonHelper = new THREE.SkeletonHelper( sourceModel.scene );
				// scene.add( sourceSkeletonHelper );

				const sourceSkeleton = new THREE.Skeleton( sourceSkeletonHelper.bones );
				console.log( sourceSkeleton );

				const retargetOptions = {

					// specify the name of the target's hip bone.
					hip: 'mixamorigHips',

					// Map of target's bone names to source's bone names
					names: {

						hips: 'mixamorigHips',

						spine: 'mixamorigSpine',
						chest: 'mixamorigSpine2',
						head: 'mixamorigHead',

						upperarml: 'mixamorigLeftArm',
						upperarmr: 'mixamorigRightArm',
						lowerarml: 'mixamorigLeftForeArm',
						lowerarmr: 'mixamorigRightForeArm',

						// upperlegl: 'mixamorigLeftUpLeg',
						// upperlegr: 'mixamorigRightUpLeg',
						// lowerlegl: 'mixamorigLeftLeg',
						// lowerlegr: 'mixamorigRightLeg',
						footl: 'mixamorigLeftFoot',
						footr: 'mixamorigRightFoot',

					}

				};

				// unreal manny
				// const retargetOptions = {

				// 	// specify the name of the target's hip bone.
				// 	hip: 'mixamorigHips',

				// 	// Map of target's bone names to source's bone names
				// 	names: {

				// 		pelvis: 'mixamorigHips',

				// 		spine_01: 'mixamorigSpine',
				// 		spine_03: 'mixamorigSpine1',
				// 		spine_04: 'mixamorigSpine2',
				// 		neck_01: 'mixamorigNeck',
				// 		// neck_02: 'mixamorigNeck',
				// 		head: 'mixamorigHead',

				// 		upperarm_l: 'mixamorigLeftArm',
				// 		upperarm_r: 'mixamorigRightArm',
				// 		lowerarm_l: 'mixamorigLeftForeArm',
				// 		lowerarm_r: 'mixamorigRightForeArm',
				// 		hand_l: 'mixamorigLeftHand',
				// 		hand_r: 'mixamorigRightHand',

				// 		// // upperlegl: 'mixamorigLeftUpLeg',
				// 		// // upperlegr: 'mixamorigRightUpLeg',
				// 		// // lowerlegl: 'mixamorigLeftLeg',
				// 		// // lowerlegr: 'mixamorigRightLeg',
				// 		// footl: 'mixamorigLeftFoot',
				// 		// footr: 'mixamorigRightFoot',

				// 	}

				// };


				// const retargeted = SkeletonUtils.retarget( targetSkin, sourceSkin, retargetOptions );
				// const peteHelper = new THREE.SkeletonHelper( pete.scene );
				// const retargeted = SkeletonUtils.retarget( peteHelper, sourceSkin, retargetOptions ); // not working
				// const retargeted = SkeletonUtils.retarget( targetSkin.skeleton, sourceSkin.skeleton, retargetOptions ); // works better?
				// console.log( retargeted );

				console.log( 'source clip:', sourceModel.animations[ 0 ] );

				if ( playAnimations ) {

					const retargetedClip = SkeletonUtils.retargetClip( targetSkin, sourceSkeleton, sourceModel.animations[ 0 ], retargetOptions );
					// const retargetedClip2 = SkeletonUtils.retargetClip( targetSkin2, sourceSkin, michelle.animations[ 0 ], retargetOptions ); //manny
					// const retargetedClip = SkeletonUtils.retargetClip( targetSkin.skeleton, sourceSkin, michelle.animations[ 0 ], retargetOptions ); // not working
					console.log( 'retargeted clip', retargetedClip );

					// Apply the mixer directly to the SkinnedMesh, not any
					// ancestor node, because that's what
					// SkeletonUtils.retargetClip outputs the clip to be
					// compatible with.
					targetMixer = new THREE.AnimationMixer( targetSkin );
					targetMixer.clipAction( retargetedClip ).play();
					// peteMixer.clipAction( retargetedClip2 ).play(); // manny

					sourceMixer = new THREE.AnimationMixer( sourceModel.scene );
					sourceMixer.clipAction( sourceModel.animations[ 0 ] ).play();

				}

			}


			renderer.setAnimationLoop( animate );


			window.onresize = function () {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			};


			function animate() {

				const delta = clock.getDelta();

				if ( playAnimations ) {

					sourceMixer.update( delta );
					targetMixer?.update( delta );
					target2Mixer?.update( delta );

				}

				controls.update();

				stats.update();

				renderer.render( scene, camera );

			}


		</script>

	</body>

</html>
